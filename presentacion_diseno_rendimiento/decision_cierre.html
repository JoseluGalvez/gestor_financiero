<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La decisión: medir y conciliar antes de escalar</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            border-top: 12px solid #38bdf8;
        }
        h1 {
            font-size: 56px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 40px;
            letter-spacing: -1px;
            max-width: 1000px;
        }
        .statement {
            font-size: 32px;
            color: #cbd5e1;
            max-width: 900px;
            line-height: 1.5;
            margin-bottom: 60px;
            font-weight: 300;
        }
        .gate-box {
            background-color: #1e293b;
            border-top: 6px solid #10b981;
            padding: 40px 60px;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gate-icon {
            font-size: 48px;
            color: #10b981;
            margin-bottom: 20px;
        }
        .gate-title {
            font-size: 24px;
            color: #10b981;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .gate-text {
            font-size: 28px;
            color: #ffffff;
            line-height: 1.4;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <h1>La decisión: medir y conciliar antes de escalar</h1>
        
        <div class="statement">
            Rendimiento confiable significa datos trazables, una metodología declarada y controles que impiden publicar resultados ambiguos.
        </div>
        
        <div class="gate-box">
            <div class="gate-icon">
                <i class="fas fa-flag-checkered"></i>
            </div>
            <div class="gate-title">Siguiente Gate</div>
            <div class="gate-text">
                Aprobar la política de rendimiento y cerrar RLS/Realtime en staging con datos ficticios.
            </div>
        </div>
    </div>
</body>
</html>
