<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portada — Criptomonedas, FIFO y borrador fiscal revisable</title>
<style>
*{box-sizing:border-box;margin:0}
.slide-container{width:1280px;min-height:720px;background:#e2e8f0;color:#1e1b4b;display:flex;position:relative;font-family:Arial,Helvetica,sans-serif}
.vertical{width:92px;border-right:2px solid #312e81;display:flex;align-items:center;justify-content:center;color:#312e81;font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)}
.main{display:flex;flex:1;flex-direction:column;justify-content:center;padding:72px 76px 72px 82px;position:relative;z-index:2}
.kicker{color:#16a34a;font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
h1{max-width:790px;font-size:64px;letter-spacing:-.065em;line-height:.98;color:#1e1b4b}
.subtitle{max-width:690px;margin-top:29px;color:#312e81;font-family:Georgia,serif;font-size:24px;line-height:1.45}
.footer{display:flex;gap:18px;align-items:center;margin-top:48px;color:#475569;font-size:15px;font-weight:700}.footer i{width:38px;height:3px;background:#16a34a;display:block}
.geometry{position:absolute;right:76px;bottom:74px;width:350px;height:300px}.ring{position:absolute;right:8px;bottom:0;width:260px;height:260px;border:26px solid #1e1b4b;border-radius:50%;opacity:.94}.ring:after{content:"";position:absolute;inset:40px;border:2px solid #16a34a;border-radius:50%}.bar-one{position:absolute;right:270px;bottom:40px;width:58px;height:166px;background:#16a34a}.bar-two{position:absolute;right:196px;bottom:40px;width:48px;height:102px;background:#312e81}.bar-three{position:absolute;right:136px;bottom:40px;width:36px;height:214px;background:#64748b}.guide{position:absolute;right:0;top:8px;width:230px;height:1px;background:#94a3b8}.guide:after{content:"TRAZABILIDAD · REVISIÓN";position:absolute;right:0;top:-22px;color:#64748b;font-size:11px;font-weight:800;letter-spacing:.12em}
</style>
</head>
<body>
<div class="slide-container">
  <div class="vertical">Portafolio Intel · Implementación 2026</div>
  <main class="main">
    <p class="kicker">Módulo de Criptomonedas</p>
    <h1>Criptomonedas,<br>FIFO y borrador<br>fiscal revisable</h1>
    <p class="subtitle">Implementación local, trazable y preparada para una revisión tributaria profesional.</p>
    <div class="footer"><i></i><span>Ventas · Permutas · Lotes FIFO · Controles de revisión</span></div>
  </main>
  <div class="geometry" aria-hidden="true"><div class="guide"></div><div class="ring"></div><div class="bar-one"></div><div class="bar-two"></div><div class="bar-three"></div></div>
</div>
</body>
</html>
