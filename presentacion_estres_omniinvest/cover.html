<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #172033;
            color: #FFFFFF;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(47, 93, 138, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(47, 93, 138, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }
        .content-wrapper {
            z-index: 2;
            text-align: center;
            max-width: 1000px;
            padding: 40px;
            background: rgba(23, 32, 51, 0.8);
            border: 1px solid rgba(47, 93, 138, 0.5);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .accent-line {
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #2F5D8A, #B54C4C);
            margin: 0 auto 30px auto;
        }
        h1 {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        h2 {
            font-size: 32px;
            font-weight: 400;
            color: #A0B2C6;
            margin-bottom: 40px;
            line-height: 1.4;
        }
        .meta-info {
            font-size: 20px;
            color: #7A8B9E;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .meta-info i {
            color: #2F5D8A;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="bg-pattern"></div>
        <div class="content-wrapper">
            <div class="accent-line"></div>
            <h1>Prueba de estrés OmniInvest</h1>
            <h2>Escenario ficticio: caída uniforme del 20 %, controles de riesgo y diversificación general</h2>
            <div class="meta-info">
                <i class="fas fa-robot"></i>
                <span>Manus AI</span>
                <span>·</span>
                <span>28 de agosto de 2026</span>
            </div>
        </div>
    </div>
</body>
</html>
