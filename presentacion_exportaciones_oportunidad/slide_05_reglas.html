<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container { width: 1280px; min-height: 720px; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding: 80px 100px; position: relative; overflow: hidden; }
      .header { display: flex; align-items: baseline; gap: 24px; margin-bottom: 50px; }
      .header-icon { width: 64px; height: 64px; background: #1e293b; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #38bdf8; font-size: 32px; }
      h2 { font-size: 48px; font-weight: 800; color: #ffffff; }
      .content-wrapper { display: flex; gap: 60px; flex: 1; align-items: center; }
      .rules-list { flex: 1; display: flex; flex-direction: column; gap: 24px; }
      .rule-item { background: #1e293b; border-left: 4px solid #10b981; padding: 24px 32px; display: flex; align-items: center; gap: 24px; }
      .rule-icon { color: #10b981; font-size: 32px; }
      .rule-text { font-size: 24px; color: #e2e8f0; line-height: 1.4; }
      .visual-side { flex: 0.8; display: flex; justify-content: center; align-items: center; }
      .circle-stack { position: relative; width: 300px; height: 300px; }
      .circle { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #0f172a; text-align: center; }
      .circle-1 { width: 300px; height: 300px; background: rgba(16, 185, 129, 0.2); border: 2px dashed #10b981; top: 0; left: 0; }
      .circle-2 { width: 220px; height: 220px; background: rgba(16, 185, 129, 0.4); top: 40px; left: 40px; }
      .circle-3 { width: 140px; height: 140px; background: #10b981; top: 80px; left: 80px; font-size: 24px; color: #ffffff; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="header-icon"><i class="fas fa-layer-group"></i></div>
            <h2>Las reglas favorables son acumulativas</h2>
        </div>
        <div class="content-wrapper">
            <div class="rules-list">
                <div class="rule-item">
                    <i class="fas fa-check-circle rule-icon"></i>
                    <div class="rule-text">Cobertura de métricas de al menos 80 %.</div>
                </div>
                <div class="rule-item">
                    <i class="fas fa-check-circle rule-icon"></i>
                    <div class="rule-text">ROIC−WACC positivo, deuda neta/EBITDA inferior a 2,0× y cobertura de intereses de al menos 3,0×.</div>
                </div>
                <div class="rule-item">
                    <i class="fas fa-check-circle rule-icon"></i>
                    <div class="rule-text">Conversión de FCF de al menos 80 % y ROE de al menos 12 % como referencias orientativas.</div>
                </div>
            </div>
            <div class="visual-side">
                <div class="circle-stack">
                    <div class="circle circle-1"></div>
                    <div class="circle circle-2"></div>
                    <div class="circle circle-3">Candidata</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
