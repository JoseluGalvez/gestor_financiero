<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container { width: 1280px; min-height: 720px; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding: 80px 100px; position: relative; overflow: hidden; }
      .slide-container::before { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; background: linear-gradient(0deg, rgba(56, 189, 248, 0.05) 0%, transparent 100%); z-index: 1; }
      .content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; }
      h2 { font-size: 56px; font-weight: 800; color: #ffffff; margin-bottom: 60px; }
      .flow-diagram { display: flex; align-items: center; gap: 20px; margin-bottom: 80px; background: #1e293b; padding: 30px 40px; border-radius: 100px; border: 1px solid #334155; }
      .flow-step { font-size: 24px; font-weight: 600; color: #e2e8f0; }
      .flow-arrow { color: #38bdf8; font-size: 24px; }
      .final-step { color: #38bdf8; }
      .warning-box { background: rgba(239, 68, 68, 0.1); border: 2px solid #ef4444; padding: 30px 40px; border-radius: 12px; display: flex; align-items: center; gap: 24px; max-width: 900px; }
      .warning-box i { color: #ef4444; font-size: 40px; }
      .warning-box p { font-size: 26px; color: #f1f5f9; font-weight: 600; margin: 0; text-align: left; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content">
            <h2>Usar la función como investigación trazable</h2>
            <div class="flow-diagram">
                <div class="flow-step">Datos consistentes</div>
                <i class="fas fa-arrow-right flow-arrow"></i>
                <div class="flow-step">Ratios explicables</div>
                <i class="fas fa-arrow-right flow-arrow"></i>
                <div class="flow-step">Evidencia</div>
                <i class="fas fa-arrow-right flow-arrow"></i>
                <div class="flow-step final-step">Revisión humana</div>
            </div>
            <div class="warning-box">
                <i class="fas fa-exclamation-triangle"></i>
                <p>No usar una exportación ni una cartera divulgada como instrucción operativa.</p>
            </div>
        </div>
    </div>
</body>
</html>
