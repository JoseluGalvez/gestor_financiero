<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container { width: 1280px; min-height: 720px; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 80px 120px; position: relative; overflow: hidden; }
      .slide-container::before { content: ""; position: absolute; top: 0; right: 0; width: 60%; height: 100%; background: linear-gradient(135deg, transparent 0%, rgba(56, 189, 248, 0.1) 100%); z-index: 1; }
      .content { position: relative; z-index: 2; }
      .eyebrow { color: #38bdf8; font-size: 24px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px; }
      h1 { font-size: 72px; font-weight: 800; line-height: 1.1; margin-bottom: 32px; color: #ffffff; }
      p { font-size: 32px; color: #94a3b8; line-height: 1.4; max-width: 800px; }
      .icon-grid { display: flex; gap: 40px; margin-top: 60px; }
      .icon-item { display: flex; align-items: center; gap: 16px; color: #e2e8f0; font-size: 24px; font-weight: 600; }
      .icon-item i { color: #38bdf8; font-size: 32px; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content">
            <div class="eyebrow">Portafolio Intel · Salud financiera</div>
            <h1>Exportaciones confiables y oportunidad explicable</h1>
            <p>El análisis local no termina en la pantalla. La misma instancia alimenta la interfaz, CSV y PDF conservando contexto y cobertura.</p>
            <div class="icon-grid">
                <div class="icon-item"><i class="fas fa-desktop"></i> Interfaz</div>
                <div class="icon-item"><i class="fas fa-file-csv"></i> CSV</div>
                <div class="icon-item"><i class="fas fa-file-pdf"></i> PDF</div>
            </div>
        </div>
    </div>
</body>
</html>
