<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container { width: 1280px; min-height: 720px; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding: 80px 100px; position: relative; overflow: hidden; }
      .header { display: flex; align-items: baseline; gap: 24px; margin-bottom: 50px; }
      .header-icon { width: 64px; height: 64px; background: #1e293b; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #38bdf8; font-size: 32px; }
      h2 { font-size: 48px; font-weight: 800; color: #ffffff; }
      .content-wrapper { display: flex; flex-direction: column; gap: 40px; flex: 1; justify-content: center; }
      .main-statement { font-size: 36px; font-weight: 700; color: #e2e8f0; line-height: 1.3; border-bottom: 2px solid #334155; padding-bottom: 30px; text-align: center; }
      .highlight { color: #38bdf8; }
      .points-container { display: flex; justify-content: space-evenly; gap: 40px; }
      .point-item { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; }
      .point-icon { width: 80px; height: 80px; background: #1e293b; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #38bdf8; font-size: 32px; border: 2px solid #334155; }
      .point-item p { font-size: 24px; color: #cbd5e1; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="header-icon"><i class="fas fa-search-dollar"></i></div>
            <h2>OPORTUNIDAD: investigar, no predecir</h2>
        </div>
        <div class="content-wrapper">
            <div class="main-statement">
                El estado favorable se denomina <span class="highlight">"candidata a investigación adicional"</span>
            </div>
            <div class="points-container">
                <div class="point-item">
                    <div class="point-icon"><i class="fas fa-ban"></i></div>
                    <p>No calcula una probabilidad de beneficios.</p>
                </div>
                <div class="point-item">
                    <div class="point-icon"><i class="fas fa-hand-paper"></i></div>
                    <p>No indica comprar, vender o mantener.</p>
                </div>
                <div class="point-item">
                    <div class="point-icon"><i class="fas fa-clipboard-check"></i></div>
                    <p>Exige contraste con fuentes, riesgos y valoración antes de decidir.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
