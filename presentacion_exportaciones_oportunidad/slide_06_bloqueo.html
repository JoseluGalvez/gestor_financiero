<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container { width: 1280px; min-height: 720px; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding: 80px 100px; position: relative; overflow: hidden; }
      .header { display: flex; align-items: baseline; gap: 24px; margin-bottom: 50px; }
      .header-icon { width: 64px; height: 64px; background: #1e293b; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #ef4444; font-size: 32px; }
      h2 { font-size: 48px; font-weight: 800; color: #ffffff; }
      .content-wrapper { display: flex; gap: 60px; flex: 1; align-items: center; }
      .alert-list { flex: 1; display: flex; flex-direction: column; gap: 24px; }
      .alert-item { background: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444; padding: 24px 32px; display: flex; align-items: center; gap: 24px; }
      .alert-icon { color: #ef4444; font-size: 32px; }
      .alert-text { font-size: 24px; color: #e2e8f0; line-height: 1.4; }
      .visual-side { flex: 0.8; display: flex; justify-content: center; align-items: center; }
      .shield-container { position: relative; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; }
      .shield-icon { font-size: 180px; color: #1e293b; position: absolute; z-index: 1; }
      .ban-icon { font-size: 100px; color: #ef4444; position: relative; z-index: 2; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="header-icon"><i class="fas fa-shield-alt"></i></div>
            <h2>Una alerta crítica bloquea el estado</h2>
        </div>
        <div class="content-wrapper">
            <div class="alert-list">
                <div class="alert-item">
                    <i class="fas fa-exclamation-circle alert-icon"></i>
                    <div class="alert-text">Deuda neta/EBITDA superior a 2,5×.</div>
                </div>
                <div class="alert-item">
                    <i class="fas fa-exclamation-circle alert-icon"></i>
                    <div class="alert-text">Cobertura de intereses inferior a 3,0×.</div>
                </div>
                <div class="alert-item">
                    <i class="fas fa-exclamation-circle alert-icon"></i>
                    <div class="alert-text">ROIC−WACC negativo o evidencia insuficiente.</div>
                </div>
            </div>
            <div class="visual-side">
                <div class="shield-container">
                    <i class="fas fa-shield-alt shield-icon"></i>
                    <i class="fas fa-ban ban-icon"></i>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
